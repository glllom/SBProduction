<!DOCTYPE html>
<html lang="he" dir="rtl">
    <head>
        <meta charset="UTF-8">
        <title>דו''ח חיתוך פחים - הזמנה {{ order.order_number }}</title>
        <!-- Bootstrap 5 RTL CSS -->
        <link rel="stylesheet"
              href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.rtl.min.css">
        <!-- Bootstrap Icons -->
        <link rel="stylesheet"
              href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
        <!-- Google Fonts -->
        <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
              rel="stylesheet">
        <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
            background-color: #f0f0f0;
        }

        .page {
            background: white;
            width: 297mm;
            min-height: 190mm;
            padding: 20mm;
            margin: 10mm auto;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
        }

        table {
            width: 100%;
            margin-top: 20px;
        }

        th, td {
            border: 1px solid #000;
            padding: 8px;
        }

        th {
            background-color: #f2f2f2;
        }

        .no-print {
            text-align: center;
            margin-bottom: 20px;
        }

        .btn {
            padding: 10px 20px;
            font-size: 16px;
            cursor: pointer;
            background-color: #007bff;
            color: white;
            border: none;
            border-radius: 5px;
            margin: 0 5px;
        }

        .btn-secondary {
            background-color: #6c757d;
        }

        @media print {
            @page {
                size: landscape;
                margin: 10mm;
            }

            body {
                background-color: white;
                margin: 0;
            }

            .page {
                margin: 0;
                box-shadow: none;
                width: 100%;
                padding: 10mm;
            }

            .no-print {
                display: none;
            }
        }
        </style>
    </head>
    <body>
        <div class="no-print">
            <button onclick="window.print()" class="btn">הדפס דו''ח</button>
            <button onclick="window.close()" class="btn btn-secondary">סגור</button>
        </div>
        <div class="page">{% include "production/includes/report_cut_sheets.html" %}</div>
    </body>
</html>
