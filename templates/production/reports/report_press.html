{% extends "production/reports/base_report.html" %}
{% block title %}פרס{{ order.order_number }}{% endblock %}
{% block body_class %}portrait{% endblock %}
{% block extra_css %}
    <style>
        @page {
            size: A4 portrait;
            margin: 10mm;
        }

        @media print {
            @page {
                size: A4 portrait !important;
                margin: 10mm;
            }
        }

        /* Тонкая серая прерывистая линия между колонками размеров */
        .page .row > .col-6:nth-child(even) {
            border-inline-start: 1.5px dashed #b0b0b0;
            padding-inline-start: 25px;
        }

        .page .row > .col-6:nth-child(odd) {
            padding-inline-end: 25px;
        }

        /* На случай, если для списка размеров использованы CSS-колонки (column-count) */
        .dimensions-list, .press-dimensions {
            column-rule: 1.5px dashed #b0b0b0;
        }

        .print-checkbox {
            display: inline-block;
            width: 17px;
            height: 17px;
            border: 1.8px solid #222222;
            border-radius: 0;
            vertical-align: bottom;
            background-color: #ffffff;
            -webkit-print-color-adjust: exact;
            print-color-adjust: exact;
        }
    </style>
{% endblock %}
{% block content %}
    <div class="page portrait">{% include "production/includes/report_press.html" %}</div>
{% endblock %}
