<!DOCTYPE html>
<html lang="he" dir="rtl">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>{% block title %}דו''ח ייצור - הזמנה {{ order.order_number }}{% endblock %}</title>
        <!-- Bootstrap 5 RTL CSS -->
        <link rel="stylesheet"
              href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.rtl.min.css">
        <!-- Bootstrap Icons -->
        <link rel="stylesheet"
              href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
        <!-- Google Fonts -->
        <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
              rel="stylesheet">
        {% load static %}
        <link rel="stylesheet" href="{% static 'css/style_reports.css' %}">
        {% block extra_css %}{% endblock %}
    </head>
    <body class="{% block body_class %}{% endblock %}">
        <div class="no-print">
            <button onclick="window.print()" class="btn btn-primary">
                <i class="bi bi-printer-fill me-1"></i>{% block print_button_text %}הדפס דו''ח{% endblock %}
            </button>
            <button onclick="window.close()" class="btn btn-secondary">
                <i class="bi bi-x-circle me-1"></i>{% block cancel_button_text %}ביטול / סגור{% endblock %}
            </button>
            {% block extra_buttons %}{% endblock %}
        </div>
        {% block content %}{% endblock %}
        {% block extra_js %}{% endblock %}
    </body>
</html>
