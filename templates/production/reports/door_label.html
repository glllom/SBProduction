<!DOCTYPE html>
<html lang="he" dir="rtl">
    <head>
        <meta charset="UTF-8">
        <title>תוויות דלתות ומדבקות - הזמנה {{ order.order_number }}</title>
        <!-- Bootstrap 5 RTL CSS -->
        <link rel="stylesheet"
              href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.rtl.min.css">
        <!-- Bootstrap Icons -->
        <link rel="stylesheet"
              href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
        <style>
        @page {
            size: 15cm 10cm; /* Landscape: width 15cm, height 10cm */
            margin: 0.5cm;
        }

        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 10px;
            box-sizing: border-box;
            background-color: #f0f0f0;
        }

        .label-card {
            width: 14cm;
            height: 9cm;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            border: 1px dashed #ccc;
            background: white;
            margin: 10px auto;
            padding: 10px;
            box-sizing: border-box;
        }

        .header {
            font-size: 20px;
            font-weight: bold;
            border-bottom: 2px solid #000;
            padding-bottom: 4px;
            display: flex;
            justify-content: space-between;
            margin: 0 5px;
        }

        .content {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-grow: 1;
            font-size: 20px;
        }

        .qr-code img {
            width: 130px;
            height: 130px;
        }

        .no-print {
            text-align: center;
            margin-bottom: 20px;
        }

        .no-print .btn {
            padding: 10px 20px;
            font-size: 16px;
            cursor: pointer;
            margin: 0 5px;
        }

        @media print {
            body {
                background: white;
                padding: 0;
                margin: 0;
            }

            .label-card {
                margin: 0;
                border: 1px dashed #ccc;
                page-break-after: always;
                break-after: page;
            }

            .no-print {
                display: none !important;
            }
        }
        </style>
    </head>
    <body>
        <div class="no-print">
            <button onclick="window.print()" class="btn btn-primary">
                <i class="bi bi-printer-fill me-1"></i>הדפס מדבקות
            </button>
            <button onclick="window.close()" class="btn btn-secondary">
                <i class="bi bi-x-circle me-1"></i>ביטול / סגור
            </button>
        </div>
        {% for label in labels %}
            <div class="label-card">
                <div class="header">
                    <div class="main">
                        <h2 class="m-0 mb-1">{{ label.order_number }} [ {{ label.mark }} \ {{ label.quantity }} ]</h2>
                        <p class="m-0 fs-5">{{ label.product_name }}</p>
                        <h4 class="m-0 mt-1" dir="ltr">{{ label.width }} \ {{ label.height }} {{ label.direction }}</h4>
                    </div>
                    <div class="qr-code">
                        <img src="data:image/svg+xml;base64,{{ label.qr_code }}" alt="QR Code">
                    </div>
                </div>
                <div class="content">
                    <div class="details" dir="ltr"></div>
                </div>
            </div>
        {% empty %}
            <div class="text-center py-5">
                <div class="alert alert-warning d-inline-block px-5">
                    <h4>אין מדבקות להדפסה</h4>
                    <p class="mb-0">לא נמצאו פריטים תואמים להפקת מדבקות.</p>
                </div>
            </div>
        {% endfor %}
    </body>
</html>
