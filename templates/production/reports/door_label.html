<!DOCTYPE html>
<html lang="he" dir="rtl">
    <head>
        <meta charset="UTF-8">
        <title>תווית דלת - הזמנה {{ order.order_number }}</title>
        <style>
        @page {
            size: 15cm 10cm; /* Landscape: width 15cm, height 10cm */
            margin: 0.5cm;
        }

        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            width: 14cm;
            height: 9cm;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            border: 1px dashed #ccc;
        }

        .header {
            font-size: 20px;
            font-weight: bold;
            border-bottom: 2px solid #000;
            padding-bottom: 1px;
            display: flex;
            justify-content: space-between;
            margin: 0 10px;
        }

        .content {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-grow: 1;
            font-size: 20px;
        }

        .qr-code img {
            width: 150px;
            height: 150px;
        }
        </style>
    </head>
    <body>
        {% for label in labels %}
            <div class="page-break"
                 style="page-break-after: always;
                        height: 100%;
                        display: flex;
                        flex-direction: column;
                        justify-content: space-between;
                        box-sizing: border-box">
                <div class="header">
                    <div class="main">
                        <h2>{{ label.order_number }} [ {{ label.mark }} \ {{ label.quantity }} ]</h2>
                        <p>{{ label.product_name }}</p>
                        <h4 dir="ltr">{{ label.width }} \ {{ label.height }} {{ label.direction }}</h4>
                    </div>
                    <div class="qr-code">
                        <img src="data:image/svg+xml;base64,{{ label.qr_code }}" alt="QR Code">
                    </div>
                </div>
                <div class="content">
                    <div class="details" dir="ltr"></div>
                </div>
            </div>
        {% endfor %}
    </body>
</html>
