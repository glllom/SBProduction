<div class="modal fade"
     id="saveSpecificationModal"
     tabindex="-1"
     aria-hidden="true">
    <div class="modal-dialog modal-md">
        <div class="modal-content border-0 shadow">
            <div class="modal-header bg-success text-white">
                <h5 class="modal-title fw-bold">
                    <i class="bi bi-bookmark-plus me-2"></i>שמירת מפרט קבוצה
                </h5>
                <button type="button"
                        class="btn-close btn-close-white"
                        data-bs-dismiss="modal"></button>
            </div>
            <form id="saveSpecForm" method="post" action="">
                {% csrf_token %}
                <div class="modal-body">
                    <div class="alert alert-light border mb-3">
                        <div class="d-flex justify-content-between align-items-center mb-1">
                            <span class="fw-bold text-primary" id="saveSpecGroupName">-</span>
                            <span class="badge bg-secondary" id="saveSpecGroupQty">- דלתות</span>
                        </div>
                        <div class="small text-muted" id="saveSpecGroupDetails">-</div>
                    </div>
                    <div class="mb-3">
                        <label class="form-label fw-bold">
                            שם המפרט <span class="text-danger">*</span>
                        </label>
                        <input type="text"
                               id="saveSpecNameInput"
                               name="name"
                               class="form-control"
                               placeholder="למשל: דלתות קומה טיפוסית / מפרט משרדים"
                               required>
                        <div class="form-text">שם מזהה שיאפשר לך לטעון מפרט זה בקלות בעתיד.</div>
                    </div>
                    <div class="mb-3">
                        <label class="form-label fw-bold">תיאור / הערות למפרט</label>
                        <textarea id="saveSpecDescInput"
                                  name="description"
                                  class="form-control"
                                  rows="3"
                                  placeholder="הערות או דגשים מיוחדים עבור מפרט זה (אופציונלי)..."></textarea>
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-light" data-bs-dismiss="modal">ביטול</button>
                    <button type="submit" class="btn btn-success px-4" id="btnSubmitSaveSpec">
                        <i class="bi bi-check2-circle me-1"></i>שמור מפרט
                    </button>
                </div>
            </form>
        </div>
    </div>
</div>
