<div class="modal fade" id="groupCustomizerModal" tabindex="-1">
    <div class="modal-dialog modal-lg">
        <div class="modal-content border-0 shadow">
            <div class="modal-header bg-light">
                <h5 class="modal-title fw-bold">ניהול שינויים ושדרוגים (Customizer)</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body">
                <div id="customizerGroupInfo" class="mb-4 p-3 border rounded bg-light">
                    <div class="d-flex justify-content-between align-items-center">
                        <div>
                            <h6 class="fw-bold mb-1" id="custModalGroupName">-</h6>
                            <small class="text-muted" id="custModalGroupDetails">-</small>
                        </div>
                        <div class="text-end">
                            <span class="badge bg-primary fs-6" id="custModalGroupQty">-</span>
                            <div class="extra-small text-muted mt-1">כמות דלתות</div>
                        </div>
                    </div>
                </div>
                <div class="mb-4 position-relative">
                    <label class="form-label fw-bold"
                           data-bs-toggle="tooltip"
                           title="הקלד שם או קוד קסטומייזר לחיפוש מהיר והוספה לקבוצה">
                        הוספת שינוי / שדרוג <i class="bi bi-info-circle help-hint-icon"></i>
                    </label>
                    <div class="input-group">
                        <span class="input-group-text bg-white border-end-0"><i class="bi bi-search"></i></span>
                        <input type="text"
                               id="customizerSearch"
                               class="form-control border-start-0 ps-0"
                               placeholder="חפש לפי שם או קוד..."
                               data-bs-toggle="tooltip"
                               title="חיפוש קסטומייזר לפי שם או קוד מקוצר">
                    </div>
                    <div id="customizerSearchResults"
                         class="list-group mt-1 shadow-sm d-none"
                         style="max-height: 300px;
                                overflow-y: auto;
                                position: absolute;
                                z-index: 1060;
                                width: 100%">
                        <!-- Results will appear here -->
                    </div>
                </div>
                <div class="table-responsive">
                    <table class="table table-hover align-middle" id="groupCustomizersTable">
                        <thead class="table-light">
                            <tr>
                                <th data-bs-toggle="tooltip" title="שם וקוד השינוי / השדרוג">שינוי / שדרוג</th>
                                <th data-bs-toggle="tooltip" title="פרמטרים מותאמים אישית לשדרוג">פרמטרים</th>
                                <th style="width: 50px;"></th>
                            </tr>
                        </thead>
                        <tbody id="groupCustomizersList">
                            <!-- Applied customizers will be here -->
                        </tbody>
                    </table>
                </div>
            </div>
            <div class="modal-footer">
                <button type="button"
                        class="btn btn-primary px-4"
                        data-bs-dismiss="modal"
                        data-bs-toggle="tooltip"
                        title="סיום ושמירת שינויים">סיום</button>
            </div>
        </div>
    </div>
</div>
