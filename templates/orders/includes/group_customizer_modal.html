<div class="modal fade"
     id="groupCustomizerModal"
     tabindex="-1"
     data-is-locked="false">
    <div class="modal-dialog modal-lg">
        <div class="modal-content">
            <div class="modal-header border-bottom">
                <h5 class="modal-title fw-bold">ניהול שינויים ושדרוגים</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body">
                <!-- Уведомление о блокировке -->
                <div id="customizerLockedAlert"
                     class="alert alert-warning d-none mb-3"
                     role="alert">
                    <i class="bi bi-lock-fill me-2"></i> הקבוצה נעולה לעריכה (עבר תאריך תחילת הייצור). הצפייה בלבד
                    פעילה.
                </div>
                <div id="customizerGroupInfo"
                     class="mb-4 py-2 px-3 border rounded-3 bg-body-tertiary">
                    <div class="d-flex justify-content-between align-items-center">
                        <div>
                            <h6 class="fw-bold mb-1" id="custModalGroupName">-</h6>
                            <small class="text-muted" id="custModalGroupDetails">-</small>
                        </div>
                        <div class="text-center">
                            <span class="badge rounded-pill bg-primary-subtle text-primary-emphasis border border-primary-subtle fs-6"
                                  id="custModalGroupQty">-</span>
                            <div class="extra-small text-muted mt-1">כמות דלתות</div>
                        </div>
                    </div>
                </div>
                <!-- Строка поиска (справа) + компактный Red Flag (слева) -->
                <div class="d-flex flex-wrap flex-sm-nowrap align-items-end gap-3 mb-4">
                    <!-- Блок поиска скрывается, если группа заблокирована -->
                    <div class="flex-grow-1 position-relative" id="customizerSearchContainer">
                        <label class="form-label fw-semibold"
                               data-bs-toggle="tooltip"
                               title="הקלד שם או קוד קסטומייזר לחיפוש מהיר והוספה לקבוצה">
                            הוספת שינוי / שדרוג <i class="bi bi-info-circle help-hint-icon"></i>
                        </label>
                        <div class="input-group">
                            <span class="input-group-text border-end-0"><i class="bi bi-search text-muted"></i></span>
                            <input type="text"
                                   id="customizerSearch"
                                   class="form-control border-start-0 ps-0"
                                   placeholder="חפש לפי שם או קוד..."
                                   data-bs-toggle="tooltip"
                                   title="חיפוש קסטומייזר לפי שם או קוד מקוצר">
                        </div>
                        <div id="customizerSearchResults"
                             class="list-group mt-1 d-none"
                             style="max-height: 300px;
                                    overflow-y: auto;
                                    position: absolute;
                                    z-index: 1060;
                                    width: 100%">
                            <!-- Results will appear here -->
                        </div>
                    </div>
                    <!-- Отдельная зона Red Flag: פרט מיוחד -->
                    <div id="specialDetailToggleWrap"
                         class="form-control d-flex align-items-center gap-2 px-3 flex-shrink-0"
                         data-bs-toggle="tooltip"
                         title="בדיקה ידנית — מסמן את הקבוצה בדוחות ומפנה מדבקה 2 לפרויקט ידני ב-Accord"
                         style="width: auto;
                                background-color: rgba(111, 66, 193, 0.06);
                                border-color: rgba(111, 66, 193, 0.28)">
                        <label class="form-check-label fw-semibold mb-0 d-flex align-items-center gap-1 text-nowrap"
                               for="custModalSpecialDetailSwitch"
                               style="color: #6f42c1;
                                      cursor: pointer">
                            <i class="bi bi-wrench-adjustable"></i>
                            פרט מיוחד
                        </label>
                        <div class="form-check form-switch m-0 p-0 d-flex align-items-center">
                            <input class="form-check-input m-0"
                                   type="checkbox"
                                   role="switch"
                                   id="custModalSpecialDetailSwitch"
                                   style="width: 2.4em;
                                          height: 1.25em;
                                          cursor: pointer">
                        </div>
                    </div>
                </div>
                <div class="table-responsive">
                    <table class="table table-hover align-middle" id="groupCustomizersTable">
                        <thead class="table-light">
                            <tr>
                                <th data-bs-toggle="tooltip" title="שם וקוד השינוי / השדרוג">שינוי / שדרוג</th>
                                <th data-bs-toggle="tooltip" title="פרמטרים מותאמים אישית לשדרוג">פרמטרים</th>
                                <th style="width: 50px;" id="customizerActionsHeader"></th>
                            </tr>
                        </thead>
                        <tbody id="groupCustomizersList">
                            <!-- Applied customizers will be here -->
                        </tbody>
                    </table>
                </div>
            </div>
            <div class="modal-footer">
                <button type="button"
                        class="btn btn-primary px-4 fw-semibold"
                        data-bs-dismiss="modal"
                        data-bs-toggle="tooltip"
                        title="סיום ושמירת שינויים">סיום</button>
            </div>
        </div>
    </div>
</div>
