{% extends "base.html" %}
{% block page_title %}משפחות מוצרים{% endblock %}
{% block content %}
    <div class="sb-page-header d-flex flex-wrap justify-content-between align-items-center gap-3 mb-4">
        <div class="d-flex align-items-center gap-3">
            <span class="sb-stat-icon sb-accent"><i class="bi bi-diagram-3"></i></span>
            <h2 class="sb-page-title h4 mb-0">משפחות מוצרים</h2>
        </div>
        <button class="btn btn-primary"
                data-bs-toggle="tooltip"
                title="הוספת משפחת מוצרים חדשה">
            <i class="bi bi-plus-lg ms-2"></i>הוסף משפחה
        </button>
    </div>
    <div class="card border shadow-sm rounded-4 overflow-hidden">
        <div class="card-body p-0">
            <div class="table-responsive">
                <table class="table table-hover align-middle mb-0">
                    <thead class="table-light">
                        <tr>
                            <th class="ps-4 fw-semibold"
                                data-bs-toggle="tooltip"
                                title="שם משפחת המוצרים">שם</th>
                            <th class="fw-semibold" data-bs-toggle="tooltip" title="קוד מקוצר">קוד</th>
                            <th class="fw-semibold"
                                data-bs-toggle="tooltip"
                                title="סוג המוצר המשויך למשפחה זו">סוג מוצר</th>
                            <th class="text-end pe-4 fw-semibold"
                                data-bs-toggle="tooltip"
                                title="פעולות אפשריות">פעולות</th>
                        </tr>
                    </thead>
                    <tbody>
                        {% for family in families %}
                            <tr>
                                <td class="ps-4 fw-semibold"
                                    data-bs-toggle="tooltip"
                                    title="{{ family.description|default:family.name }}">{{ family.name }}</td>
                                <td>
                                    <span class="badge bg-secondary-subtle text-secondary-emphasis font-monospace fw-normal"
                                          data-bs-toggle="tooltip"
                                          title="קוד משפחה: {{ family.code|default:'ללא קוד' }}">{{ family.code|default:"-" }}</span>
                                </td>
                                <td data-bs-toggle="tooltip"
                                    title="{{ family.product_type.description|default:family.product_type.name }}">
                                    <span class="badge bg-info-subtle text-info-emphasis fw-normal">{{ family.product_type.name }}</span>
                                </td>
                                <td class="text-end pe-4">
                                    <button class="btn btn-outline-secondary btn-sm sb-icon-btn d-inline-flex align-items-center justify-content-center p-0"
                                            data-bs-toggle="tooltip"
                                            title="עריכת משפחת מוצרים: {{ family.name }}">
                                        <i class="bi bi-pencil"></i>
                                    </button>
                                </td>
                            </tr>
                        {% empty %}
                            <tr>
                                <td colspan="4" class="p-0">
                                    <div class="sb-empty">
                                        <i class="bi bi-inbox d-block mb-2"></i>
                                        אין נתונים
                                    </div>
                                </td>
                            </tr>
                        {% endfor %}
                    </tbody>
                </table>
            </div>
        </div>
    </div>
{% endblock %}
