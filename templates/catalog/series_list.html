{% extends "base.html" %}

{% block page_title %}סדרות מוצרים{% endblock %}

{% block content %}
<div class="d-flex justify-content-between align-items-center mb-4">
    <h2 class="h4 mb-0">סדרות מוצרים</h2>
    <button class="btn btn-primary btn-sm" data-bs-toggle="tooltip" title="הוספת סדרת מוצרים חדשה">
        <i class="bi bi-plus-lg ms-2"></i>הוסף סדרה
    </button>
</div>

<div class="card shadow-sm border-0">
    <div class="card-body p-0">
        <div class="table-responsive">
            <table class="table table-hover align-middle mb-0">
                <thead class="bg-light text-muted small text-uppercase">
                    <tr>
                        <th class="ps-4" data-bs-toggle="tooltip" title="שם סדרת המוצרים">שם</th>
                        <th data-bs-toggle="tooltip" title="קוד מקוצר">קוד</th>
                        <th class="text-end pe-4" data-bs-toggle="tooltip" title="פעולות אפשריות">פעולות</th>
                    </tr>
                </thead>
                <tbody>
                    {% for s in series %}
                    <tr>
                        <td class="ps-4 fw-medium" data-bs-toggle="tooltip" title="{{ s.description|default:s.name }}">
                            {{ s.name }}
                        </td>
                        <td>
                            <code data-bs-toggle="tooltip" title="קוד סדרה: {{ s.code|default:'ללא קוד' }}">{{ s.code|default:"-" }}</code>
                        </td>
                        <td class="text-end pe-4">
                            <button class="btn btn-link btn-sm text-dark" data-bs-toggle="tooltip" title="עריכת סדרה: {{ s.name }}">
                                <i class="bi bi-pencil"></i>
                            </button>
                        </td>
                    </tr>
                    {% empty %}
                    <tr><td colspan="3" class="text-center py-4">אין נתונים</td></tr>
                    {% endfor %}
                </tbody>
            </table>
        </div>
    </div>
</div>
{% endblock %}
