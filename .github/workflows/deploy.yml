name: Django Auto-Deploy

on:
  push:
    branches: [ master ]

jobs:
  deploy:
    runs-on: self-hosted

    steps:
      # 1. СНАЧАЛА останавливаем службу, чтобы разблокировать файлы
      - name: Stop Service
        shell: powershell
        run: |
          Stop-Service -Name "DjangoAPI" -Force -ErrorAction SilentlyContinue
          Start-Sleep -s 3

      # 2. ТЕПЕРЬ подтягиваем новый код (файлы уже не заблокированы)
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          clean: false  # Предотвращает ошибки удаления заблокированных логов/файлов

      # 3. Обновляем окружение и базу
      - name: Production Update
        shell: powershell
        run: |
          if (!(Test-Path "venv")) { python -m venv venv }

          & ".\venv\Scripts\python.exe" -m pip install --upgrade pip
          & ".\venv\Scripts\python.exe" -m pip install -r requirements.txt
          & ".\venv\Scripts\python.exe" manage.py collectstatic --noinput
          & ".\venv\Scripts\python.exe" manage.py migrate --noinput

      # 4. ВЫПОЛНЯЕТСЯ ВСЕГДА (даже если сборка упала на миграциях), чтобы сервер не остался выключенным
      - name: Start Service
        if: always()
        shell: powershell
        run: |
          Start-Service -Name "DjangoAPI" -ErrorAction SilentlyContinue